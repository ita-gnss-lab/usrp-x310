[GNSS-SDR]
; run `./run_gnss_sdr.sh --conf l1ca8bits4msps_l5_8bits20msps.conf [recordings/<name>.sigmf]` to start GNSS-SDR with
; this configuration file
; input: recordings from x310usrp_record.py tuned to GPS L1 and L5 (the default --freq), L1 at 4 MS/s and L5 at
; 20 MS/s, 8-bit (--int8-div: SigMF ci8, interleaved int8 I/Q, 2 bytes per sample; run_gnss_sdr.sh switches
; item_type/DataTypeAdapter to ishort/Ishort_To_Complex for 16-bit ci16_le)
; both files are read at ONE rate (20 MS/s): run_gnss_sdr.sh upsamples the 4 MS/s L1 file 5x before gnss-sdr
; (zero-order hold, each sample repeated 5 times, what Direct_Resampler did inside gnss-sdr), because the source
; below takes one sampling_frequency for both files
GNSS-SDR.internal_fs_sps=20000000
; ONE source reading both files: Multichannel_File_Signal_Source passes them through a single block, so both bands
; advance in lockstep. With two File_Signal_Sources each band runs as fast as the CPU allows,
; L1 got ~3x ahead of L5, and Observables discarded every L5 measurement
GNSS-SDR.num_sources=1
; dual-frequency: once a satellite is tracked on L1, its L5 acquisition is assisted (searched only for that
; satellite, around its L1 Doppler scaled to L5) instead of a blind search over every PRN and Doppler
GNSS-SDR.assist_dual_frequency_acq=true

; -------- Signal source: file 0 = GPS L1 (1575.42 MHz, TwinRX RX0), file 1 = GPS L5 (1176.45 MHz, TwinRX RX1) --------
SignalSource.implementation=Multichannel_File_Signal_Source
; number of files to read
SignalSource.total_channels=2
; number of output streams, one signal conditioner each (stream 0 -> SignalConditioner0, 1 -> SignalConditioner1)
SignalSource.RF_channels=2
SignalSource.filename0=/home/tapyu/git/usrp-x310/extracted_sigmf/x310_name/x310_name_ch0.sigmf-data
SignalSource.filename1=/home/tapyu/git/usrp-x310/extracted_sigmf/x310_name/x310_name_ch1.sigmf-data
; one item_type and one sampling_frequency for both files: both must have the same format and rate (L1 upsampled)
SignalSource.item_type=ibyte
SignalSource.sampling_frequency=20000000
SignalSource.samples=0

; -------- Signal conditioner 0 (L1) --------
SignalConditioner0.implementation=Signal_Conditioner
DataTypeAdapter0.implementation=Ibyte_To_Complex
InputFilter0.implementation=Pass_Through
Resampler0.implementation=Pass_Through

; -------- Signal conditioner 1 (L5) --------
SignalConditioner1.implementation=Signal_Conditioner
DataTypeAdapter1.implementation=Ibyte_To_Complex
InputFilter1.implementation=Pass_Through
Resampler1.implementation=Pass_Through

; -------- Channels --------
; GNSS-SDR numbers channels 1C first, then L5: Channel0-7 are L1 C/A, Channel8-15 are L5
Channels_1C.count=8
Channels_L5.count=8
Channels.in_acquisition=1

Channel0.RF_channel_ID=0
Channel1.RF_channel_ID=0
Channel2.RF_channel_ID=0
Channel3.RF_channel_ID=0
Channel4.RF_channel_ID=0
Channel5.RF_channel_ID=0
Channel6.RF_channel_ID=0
Channel7.RF_channel_ID=0
Channel8.RF_channel_ID=1
Channel9.RF_channel_ID=1
Channel10.RF_channel_ID=1
Channel11.RF_channel_ID=1
Channel12.RF_channel_ID=1
Channel13.RF_channel_ID=1
Channel14.RF_channel_ID=1
Channel15.RF_channel_ID=1

; -------- GPS L1 C/A acquisition --------
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.pfa=0.001
Acquisition_1C.doppler_max=5000
Acquisition_1C.doppler_step=250
; true (the default; false is meant for live radios): while a channel searches, the stream of this band waits,
; so the channels already tracking pause with it, but no sample is skipped and runs on files are reproducible
Acquisition_1C.blocking=true

; -------- GPS L5 acquisition --------
Acquisition_L5.implementation=GPS_L5i_PCPS_Acquisition
Acquisition_L5.item_type=gr_complex
Acquisition_L5.coherent_integration_time_ms=1
; 0.001 (was 0.01): fewer false acquisitions -- with 0.01, L5 "locked" on PRN 16 (IIR) and 29 (IIR-M),
; satellites that do not transmit L5 at all
Acquisition_L5.pfa=0.001
Acquisition_L5.doppler_max=5000
; 100 (was 250): finer Doppler grid, so L5 tracking starts at most ~50 Hz off instead of ~125 Hz -- with
; 250, most L5 channels lost carrier lock (carrier_lock_fail_counter:5001) within seconds of starting
Acquisition_L5.doppler_step=100
; true (the default): see Acquisition_1C.blocking
Acquisition_L5.blocking=true

; -------- GPS L1 C/A tracking --------
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex

; -------- GPS L5 tracking --------
Tracking_L5.implementation=GPS_L5_DLL_PLL_Tracking
Tracking_L5.item_type=gr_complex
; track the dataless pilot (Q5) component: no data-bit transitions, so the carrier loop can be a pure PLL
Tracking_L5.track_pilot=true
; once the pilot's secondary code is locked, integrate coherently over 10 code periods (10 ms) instead of 1 ms,
; and narrow the loops (~10 dB more correlation gain). 10, not 20: an L5 data symbol lasts 10 ms (100 sps), and
; with 20 ms the navigation message (CNAV) was rarely decoded -- without it L5 never gets a transmit time, so it
; never produces a pseudorange (observables.mat showed no L5 data at all)
Tracking_L5.extend_correlation_symbols=10
Tracking_L5.pll_bw_hz=20.0
Tracking_L5.dll_bw_hz=0.5
Tracking_L5.pll_bw_narrow_hz=5.0
Tracking_L5.dll_bw_narrow_hz=0.2
; let a frequency-lock loop pull in the residual acquisition frequency error first, then hand over to the PLL:
; a 20 Hz PLL alone cannot reliably pull in tens of Hz of error, so the carrier never locked
Tracking_L5.enable_fll_pull_in=true
Tracking_L5.fll_bw_hz=10.0

; -------- Navigation message --------
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_L5.implementation=GPS_L5_Telemetry_Decoder

; -------- Observables --------
Observables.implementation=Hybrid_Observables

; -------- PVT --------
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
; dual-frequency L1/L5 ionosphere-free combination: needs >= 4 satellites tracked on BOTH L1 and L5 at the
; same time (only Block IIF and III satellites broadcast L5)
PVT.iono_model=Iono-Free-LC
; GPS L5 is still pre-operational: its CNAV messages flag the satellites as unhealthy (seen on PRN 10, 18, 27),
; and by default gnss-sdr then drops them from the PVT -- leaving no dual-frequency satellites at all. Use them anyway
PVT.use_unhealthy_sats=true
