[GNSS-SDR]
; run `gnss-sdr --config_file=gps_l1_l5_file.conf` to start GNSS-SDR with this configuration file
; input: 8-bit recordings from x310usrp_record.py (SigMF ci8: interleaved int8 I/Q, 2 bytes per sample),
; L1 at 4 MS/s and L5 at 20 MS/s. Easiest: ./gps_l1_l5_file.sh [recordings/<name>.sigmf], which extracts the
; archive to /tmp, points the filenames below at it, runs gnss-sdr, and deletes the extracted files afterwards.
; To run this file directly instead, extract first:
;   mkdir -p extracted_sigmf && tar -xf recordings/x310_20261020T002210Z.sigmf -C extracted_sigmf
; all processing runs at one internal rate, so L1 is upsampled 4 -> 20 MS/s (Resampler0) to match L5
GNSS-SDR.internal_fs_sps=20000000
GNSS-SDR.num_sources=2
; dual-frequency: once a satellite is tracked on L1, its L5 acquisition is assisted (searched only for that
; satellite, around its L1 Doppler scaled to L5) instead of a blind search over every PRN and Doppler
GNSS-SDR.assist_dual_frequency_acq=true

; -------- Signal source 0: GPS L1 (1575.42 MHz, TwinRX RX0) --------
SignalSource0.implementation=File_Signal_Source
SignalSource0.filename=/home/tapyu/git/usrp-x310/extracted_sigmf/x310_20261020T002210Z/x310_20261020T002210Z_ch0.sigmf-data
SignalSource0.item_type=ibyte
SignalSource0.sampling_frequency=4000000
SignalSource0.samples=0

; -------- Signal source 1: GPS L5 (1176.45 MHz, TwinRX RX1) --------
SignalSource1.implementation=File_Signal_Source
SignalSource1.filename=/home/tapyu/git/usrp-x310/extracted_sigmf/x310_20261020T002210Z/x310_20261020T002210Z_ch1.sigmf-data
SignalSource1.item_type=ibyte
SignalSource1.sampling_frequency=20000000
SignalSource1.samples=0

; -------- Signal conditioner 0 (L1) --------
SignalConditioner0.implementation=Signal_Conditioner
DataTypeAdapter0.implementation=Ibyte_To_Complex
InputFilter0.implementation=Pass_Through
; 4 MS/s -> 20 MS/s, to match L5 and GNSS-SDR.internal_fs_sps. Direct_Resampler (zero-order hold: each
; sample repeated 5x) rather than Mmse_Resampler, whose built-in anti-aliasing filter only supports downsampling
Resampler0.implementation=Direct_Resampler
Resampler0.item_type=gr_complex
Resampler0.sample_freq_in=4000000
Resampler0.sample_freq_out=20000000

; -------- Signal conditioner 1 (L5) --------
SignalConditioner1.implementation=Signal_Conditioner
DataTypeAdapter1.implementation=Ibyte_To_Complex
InputFilter1.implementation=Pass_Through
Resampler1.implementation=Pass_Through

; -------- Channels --------
; GNSS-SDR numbers channels 1C first, then L5: Channel0-7 are L1 C/A, Channel8-15 are L5
Channels_1C.count=8
Channels_L5.count=8
Channels.in_acquisition=1

Channel0.RF_channel_ID=0
Channel1.RF_channel_ID=0
Channel2.RF_channel_ID=0
Channel3.RF_channel_ID=0
Channel4.RF_channel_ID=0
Channel5.RF_channel_ID=0
Channel6.RF_channel_ID=0
Channel7.RF_channel_ID=0
Channel8.RF_channel_ID=1
Channel9.RF_channel_ID=1
Channel10.RF_channel_ID=1
Channel11.RF_channel_ID=1
Channel12.RF_channel_ID=1
Channel13.RF_channel_ID=1
Channel14.RF_channel_ID=1
Channel15.RF_channel_ID=1

; -------- GPS L1 C/A acquisition --------
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.pfa=0.001
Acquisition_1C.doppler_max=5000
Acquisition_1C.doppler_step=250

; -------- GPS L5 acquisition --------
Acquisition_L5.implementation=GPS_L5i_PCPS_Acquisition
Acquisition_L5.item_type=gr_complex
Acquisition_L5.coherent_integration_time_ms=1
; 0.001 (was 0.01): fewer false acquisitions -- with 0.01, L5 "locked" on PRN 16 (IIR) and 29 (IIR-M),
; satellites that do not transmit L5 at all
Acquisition_L5.pfa=0.001
Acquisition_L5.doppler_max=5000
Acquisition_L5.doppler_step=250

; -------- GPS L1 C/A tracking --------
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex

; -------- GPS L5 tracking --------
Tracking_L5.implementation=GPS_L5_DLL_PLL_Tracking
Tracking_L5.item_type=gr_complex
; track the dataless pilot (Q5) component: no data-bit transitions, so the carrier loop can be a pure PLL
Tracking_L5.track_pilot=true
; once the pilot's 20-bit secondary code is locked, integrate coherently over 20 code periods (20 ms)
; instead of 1 ms, and narrow the loops: ~13 dB more correlation gain, far fewer losses of lock
Tracking_L5.extend_correlation_symbols=20
Tracking_L5.pll_bw_hz=20.0
Tracking_L5.dll_bw_hz=0.5
Tracking_L5.pll_bw_narrow_hz=5.0
Tracking_L5.dll_bw_narrow_hz=0.2

; -------- Navigation message --------
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_L5.implementation=GPS_L5_Telemetry_Decoder

; -------- Observables --------
Observables.implementation=Hybrid_Observables

; -------- PVT --------
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
; dual-frequency L1/L5 ionosphere-free combination: needs >= 4 satellites tracked on BOTH L1 and L5 at the
; same time (only Block IIF and III satellites broadcast L5)
PVT.iono_model=Iono-Free-LC
