[GNSS-SDR]
; run `gnss-sdr --config_file=gps_l1_file.conf` to start GNSS-SDR with this configuration file
GNSS-SDR.internal_fs_sps=2000000

; -------- Signal source --------
SignalSource.implementation=File_Signal_Source
SignalSource.filename=/home/tapyu/git/usrp-x310/extracted_sigmf/x310_20261013T215749Z/x310_20261013T215749Z_ch0.sigmf-data
SignalSource.item_type=ishort ; tells GNSS-SDR that the file holds interleaved 16-bit signed integers: I₀, Q₀, I₁, Q₁, …, each 2 bytes. That's how your recorder writes sc16 samples (SigMF ci16_le), so each complex sample takes 4 bytes. 
SignalSource.sampling_frequency=2000000
SignalSource.samples=0

; -------- Signal conditioner --------
SignalConditioner.implementation=Signal_Conditioner

DataTypeAdapter.implementation=Ishort_To_Complex

InputFilter.implementation=Pass_Through
Resampler.implementation=Pass_Through

; -------- Channels --------
Channels_1C.count=8
Channels.in_acquisition=1

; -------- GPS L1 C/A acquisition --------
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex ; GNU Radio's complex sample type, std::complex<float> with I and Q as 32-bit floats
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.pfa=0.001
Acquisition_1C.doppler_max=5000
Acquisition_1C.doppler_step=250

; -------- GPS L1 C/A tracking --------
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex

; -------- Navigation message --------
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder

; -------- Observables --------
Observables.implementation=Hybrid_Observables

; -------- PVT --------
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
