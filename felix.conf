[GNSS-SDR]

;######### GLOBAL OPTIONS ##################

Receiver.sources_count=2
;GNSS-SDR.num_sources=2   ; starting from v0.0.15

GNSS-SDR.internal_fs_sps=4000000

GNSS-SDR.assist_dual_frequency_acq=true


GNSS-SDR.telecommand_enabled=true
GNSS-SDR.telecommand_tcp_port=3333

;######### SUPL RRLP GPS assistance configuration #####
; Check http://www.mcc-mnc.com/
; On Android: https://play.google.com/store/apps/details?id=net.its_here.cellidinfo&hl=en
;GNSS-SDR.SUPL_gps_enabled=true
;GNSS-SDR.SUPL_read_gps_assistance_xml=false
;GNSS-SDR.SUPL_gps_ephemeris_server=supl.google.com
;GNSS-SDR.SUPL_gps_ephemeris_port=7275
;GNSS-SDR.SUPL_gps_acquisition_server=supl.google.com
;GNSS-SDR.SUPL_gps_acquisition_port=7275
;GNSS-SDR.SUPL_MCC=724
;GNSS-SDR.SUPL_MNC=08
;GNSS-SDR.SUPL_LAC=0x59e2
;GNSS-SDR.SUPL_CI=0x31b0

;######### SIGNAL_SOURCE CONFIG ############
SignalSource0.implementation=Osmosdr_Signal_Source
SignalSource0.item_type=gr_complex
SignalSource0.sampling_frequency=4000000
SignalSource0.freq=1575420000
SignalSource0.gain=15 ;RF amplifier hackrf on if >10
SignalSource0.rf_gain=40 ; 40
SignalSource0.if_gain=32 ;30
SignalSource0.samples=0
SignalSource0.repeat=false
SignalSource0.AGC_enabled=false
SignalSource0.enable_throttle_control=false
SignalSource0.antenna=LNAW
SignalSource0.osmosdr_args=hackrf=0,bias=0,buffers=256
SignalSource0.dump=false
SignalSource0.dump_filename=./signal_source_L1.dat

SignalSource1.implementation=Osmosdr_Signal_Source
SignalSource1.item_type=gr_complex
SignalSource1.sampling_frequency=4000000
SignalSource1.freq=1227600000
SignalSource1.gain=15 ;RF amplifier hackrf on if >10
SignalSource1.rf_gain=40 ; 40
SignalSource1.if_gain=32 ;30
SignalSource1.samples=0
SignalSource1.repeat=false
SignalSource1.AGC_enabled=false
SignalSource1.enable_throttle_control=false
SignalSource1.antenna=LNAW
SignalSource1.osmosdr_args=hackrf=1,bias=0,buffers=256
SignalSource1.dump=false
SignalSource1.dump_filename=./signal_source_L2.dat

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner0.implementation=Signal_Conditioner
SignalConditioner1.implementation=Signal_Conditioner

;######### DATA_TYPE_ADAPTER CONFIG ############
DataTypeAdapter0.implementation=Pass_Through
DataTypeAdapter1.implementation=Pass_Through

;######### INPUT_FILTER CONFIG ############
InputFilter0.implementation=Pass_Through
InputFilter1.implementation=Pass_Through


;######### RESAMPLER CONFIG ############
Resampler0.implementation=Pass_Through
Resampler1.implementation=Pass_Through

;######### CHANNELS GLOBAL CONFIG ############

######### CHANNELS CONFIG ############
Channels_1C.count=8
Channels_2S.count=8
Channels.in_acquisition=1

Channel0.signal=1C
Channel1.signal=1C
Channel2.signal=1C
Channel3.signal=1C
Channel4.signal=1C
Channel5.signal=1C
Channel6.signal=1C
Channel7.signal=1C
Channel8.signal=2S
Channel9.signal=2S
Channel10.signal=2S
Channel11.signal=2S
Channel12.signal=2S
Channel13.signal=2S
Channel14.signal=2S
Channel15.signal=2S

Channel0.RF_channel_ID=0
Channel1.RF_channel_ID=0
Channel2.RF_channel_ID=0
Channel3.RF_channel_ID=0
Channel4.RF_channel_ID=0
Channel5.RF_channel_ID=0
Channel6.RF_channel_ID=0
Channel7.RF_channel_ID=0
Channel8.RF_channel_ID=1
Channel9.RF_channel_ID=1
Channel10.RF_channel_ID=1
Channel11.RF_channel_ID=1
Channel12.RF_channel_ID=1
Channel13.RF_channel_ID=1
Channel14.RF_channel_ID=1
Channel15.RF_channel_ID=1





;######### ACQUISITION GLOBAL CONFIG ############
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.dump=false
Acquisition_1C.dump_filename=./acq_dump_GPS_L1.dat
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.pfa=0.001
Acquisition_1C.doppler_max=5000
Acquisition_1C.doppler_step=100
Acquisition_1C.max_dwells=1
Acquisition_1C.repeat_satellite=true
Acquisition_1C.blocking=flase

Acquisition_2S.implementation=GPS_L2_M_PCPS_Acquisition
Acquisition_2S.dump=false
Acquisition_2S.dump_filename=./acq_dump_GPS_L2_M.dat
Acquisition_2S.item_type=gr_complex
Acquisition_2S.coherent_integration_time_ms=20
Acquisition_2S.pfa=0.00001
Acquisition_2S.doppler_max=5000
Acquisition_2S.doppler_step=100
Acquisition_2S.max_dwells=1
Acquisition_2S.repeat_satellite=true
Acquisition_2S.blocking=false



;######### TRACKING GLOBAL CONFIG ############
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.dump=false
Tracking_1C.dump_filename=./GPS_L1_tracking_ch_
Tracking_1C.dump_mat=false
Tracking_1C.pll_bw_hz=50
Tracking_1C.pll_bw_narrow_hz=5
Tracking_1C.dll_bw_hz=5
Tracking_1C.dll_bw_narrow_hz=1
Tracking_1C.order=3
Tracking_1C.early_late_space_narrow_chips=0.05
Tracking_1C.early_late_space_chips=0.5

Tracking_2S.implementation=GPS_L2_M_DLL_PLL_Tracking
Tracking_2S.item_type=gr_complex
Tracking_2S.dump=false
Tracking_2S.dump_filename=./GPS_L2_M_tracking_ch_
Tracking_2S.dump_mat=false
Tracking_2S.pll_bw_hz=50
Tracking_2S.dll_bw_hz=5
Tracking_2S.early_late_spacing_chips=0.5
Tracking_2S.dll_filter_order=3
Tracking_2S.pll_filter_order=3

;######### TELEMETRY DECODER GPS CONFIG ############
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_1C.dump=false


TelemetryDecoder_2S.implementation=GPS_L2C_Telemetry_Decoder
TelemetryDecoder_2S.dump=false



;######### OBSERVABLES CONFIG ############
Observables.implementation=Hybrid_Observables
Observables.dump=false
Observables.dump_filename=./observables.dat


;######### PVT CONFIG ############
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=PPP_Static  ; options: Single, Static, Kinematic, PPP_Static, PPP_Kinematic
PVT.iono_model=Broadcast ; options: OFF, Broadcast, SBAS, Iono-Free-LC, Estimate_STEC, IONEX
PVT.trop_model=Saastamoinen ; options: OFF, Saastamoinen, SBAS, Estimate_ZTD, Estimate_ZTD_GradPVT.positioning_mode=PPP_Static
PVT.output_rate_ms=100
PVT.display_rate_ms=1000
PVT.rtcm_output_file_enabled=false
PVT.gpx_output_enabled=false
PVT.geojson_output_enabled=false
PVT.nmea_output_file_enabled=false
PVT.flag_rtcm_server=false
PVT.flag_rtcm_tty_port=false
PVT.rtcm_dump_devname=/dev/pts/1
PVT.rtcm_tcp_port=2101
PVT.rtcm_MT1019_rate_ms=5000
PVT.rtcm_MT1077_rate_ms=1000
PVT.rinex_version=2

PVT.enable_monitor=true
PVT.monitor_client_addresses=127.0.0.1
PVT.monitor_udp_port=1111


;############ MONITOR CONFIG #################

Monitor.enable_monitor=true
Monitor.decimation_factor=1
Monitor.client_addresses=127.0.0.1
Monitor.udp_port=1112
