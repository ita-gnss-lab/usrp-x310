[GNSS-SDR]
; run `./run_gnss_sdr.sh --conf galileo_e1_8bits4msps_e5a_8bits20msps.conf [recordings/<name>.sigmf]` to start GNSS-SDR with
; this configuration file
; Galileo E1-B/C + E5a from the same daily recording as l1ca8bits4msps_l5_8bits20msps.conf (E1 shares GPS L1's
; 1575.42 MHz, E5a shares GPS L5's 1176.45 MHz), processed in a second GNSS-SDR run so GNSS-SDR's own PVT can use the
; ionosphere-free E1/E5a combination: every Galileo satellite broadcasts both signals, unlike GPS L5.
; input: recordings from x310usrp_record.py tuned to GPS L1 and L5 (the default --freq), L1 at 4 MS/s and L5 at
; 20 MS/s, 8-bit (--int8-div: SigMF ci8, interleaved int8 I/Q, 2 bytes per sample; run_gnss_sdr.sh switches
; item_type/DataTypeAdapter to ishort/Ishort_To_Complex for 16-bit ci16_le)
; both files are read at ONE rate (20 MS/s): run_gnss_sdr.sh upsamples the 4 MS/s L1 file 5x before gnss-sdr
; (zero-order hold, each sample repeated 5 times, what Direct_Resampler did inside gnss-sdr), because the source
; below takes one sampling_frequency for both files
GNSS-SDR.internal_fs_sps=20000000
; ONE source reading both files: Multichannel_File_Signal_Source passes them through a single block, so both bands
; advance in lockstep. With two File_Signal_Sources (gps_l1_l5_file.conf) each band runs as fast as the CPU allows,
; L1 got ~3x ahead of L5, and Observables discarded every L5 measurement
GNSS-SDR.num_sources=1
; dual-frequency: once a satellite is tracked on E1, its E5a acquisition is assisted (searched only for that
; satellite, around its E1 Doppler scaled to E5a) instead of a blind search over every PRN and Doppler
GNSS-SDR.assist_dual_frequency_acq=true

; -------- Signal source: file 0 = E1 (1575.42 MHz, TwinRX RX0), file 1 = E5a (1176.45 MHz, TwinRX RX1) --------
SignalSource.implementation=Multichannel_File_Signal_Source
; number of files to read
SignalSource.total_channels=2
; number of output streams, one signal conditioner each (stream 0 -> SignalConditioner0, 1 -> SignalConditioner1)
SignalSource.RF_channels=2
SignalSource.filename0=/home/tapyu/git/usrp-x310/extracted_sigmf/x310_name/x310_name_ch0.sigmf-data
SignalSource.filename1=/home/tapyu/git/usrp-x310/extracted_sigmf/x310_name/x310_name_ch1.sigmf-data
; one item_type and one sampling_frequency for both files: both must have the same format and rate (L1 upsampled)
SignalSource.item_type=ibyte
SignalSource.sampling_frequency=20000000
SignalSource.samples=0

; -------- Signal conditioner 0 (E1) --------
SignalConditioner0.implementation=Signal_Conditioner
DataTypeAdapter0.implementation=Ibyte_To_Complex
InputFilter0.implementation=Pass_Through
Resampler0.implementation=Pass_Through

; -------- Signal conditioner 1 (E5a) --------
SignalConditioner1.implementation=Signal_Conditioner
DataTypeAdapter1.implementation=Ibyte_To_Complex
InputFilter1.implementation=Pass_Through
Resampler1.implementation=Pass_Through

; -------- Channels --------
; GNSS-SDR numbers channels 1B first, then 5X: Channel0-7 are Galileo E1-B/C, Channel8-15 are Galileo E5a
Channels_1B.count=8
Channels_5X.count=8
Channels.in_acquisition=1

Channel0.RF_channel_ID=0
Channel1.RF_channel_ID=0
Channel2.RF_channel_ID=0
Channel3.RF_channel_ID=0
Channel4.RF_channel_ID=0
Channel5.RF_channel_ID=0
Channel6.RF_channel_ID=0
Channel7.RF_channel_ID=0
Channel8.RF_channel_ID=1
Channel9.RF_channel_ID=1
Channel10.RF_channel_ID=1
Channel11.RF_channel_ID=1
Channel12.RF_channel_ID=1
Channel13.RF_channel_ID=1
Channel14.RF_channel_ID=1
Channel15.RF_channel_ID=1

; -------- Galileo E1-B/C acquisition --------
Acquisition_1B.implementation=Galileo_E1_PCPS_Ambiguous_Acquisition
Acquisition_1B.item_type=gr_complex
; one E1 code period is 4 ms (4092 chips at 1.023 Mcps); the block integrates over it
Acquisition_1B.pfa=0.001
Acquisition_1B.doppler_max=5000
; 125 Hz, as gnss-sdr's conf/File_input/MultiCons examples: bins well inside the 4-ms integration's ~250 Hz response
Acquisition_1B.doppler_step=125
; true (the default): see l1ca8bits4msps_l5_8bits20msps.conf
Acquisition_1B.blocking=true

; -------- Galileo E5a acquisition --------
Acquisition_5X.implementation=Galileo_E5a_Pcps_Acquisition
Acquisition_5X.item_type=gr_complex
Acquisition_5X.coherent_integration_time_ms=1
Acquisition_5X.pfa=0.001
Acquisition_5X.doppler_max=5000
; 100 Hz, as Acquisition_L5 (same 10.23 Mcps code and 1-ms period)
Acquisition_5X.doppler_step=100
Acquisition_5X.blocking=true

; -------- Galileo E1-B/C tracking --------
Tracking_1B.implementation=Galileo_E1_DLL_PLL_VEML_Tracking
Tracking_1B.item_type=gr_complex
; track the dataless pilot (E1-C): no data-bit transitions, so the carrier loop can be a pure PLL
Tracking_1B.track_pilot=true
Tracking_1B.pll_bw_hz=15.0
Tracking_1B.dll_bw_hz=2.0
Tracking_1B.early_late_space_chips=0.15
Tracking_1B.very_early_late_space_chips=0.6

; -------- Galileo E5a tracking --------
Tracking_5X.implementation=Galileo_E5a_DLL_PLL_Tracking
Tracking_5X.item_type=gr_complex
; track the dataless pilot (E5a-Q), as Tracking_L5
Tracking_5X.track_pilot=true
; as Tracking_L5 (E5a has GPS L5's structure: 10.23 Mcps, 1-ms primary code, pilot with a 100-symbol secondary
; code): once the secondary code is synchronized, integrate coherently over 10 ms with narrow loops. With 1-ms
; integration only (first run, 22/10/2026 19:00), E5a was phase-locked 26-54 % of the time, and the iono-free PVT
; had a fix 34 % of the run with 32 m RMS 2-D
Tracking_5X.extend_correlation_symbols=10
Tracking_5X.pll_bw_hz=20.0
Tracking_5X.dll_bw_hz=0.5
Tracking_5X.pll_bw_narrow_hz=5.0
Tracking_5X.dll_bw_narrow_hz=0.2
Tracking_5X.enable_fll_pull_in=true
Tracking_5X.fll_bw_hz=10.0

; -------- Navigation message --------
TelemetryDecoder_1B.implementation=Galileo_E1B_Telemetry_Decoder
TelemetryDecoder_5X.implementation=Galileo_E5a_Telemetry_Decoder

; -------- Observables --------
Observables.implementation=Hybrid_Observables

; -------- PVT --------
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
; dual-frequency E1/E5a ionosphere-free combination, computed by GNSS-SDR itself (rtklib_solver.cc pairs each
; satellite's E5a observation with its E1 one); needs >= 4 satellites tracked on both
PVT.iono_model=Iono-Free-LC
PVT.trop_model=Saastamoinen
