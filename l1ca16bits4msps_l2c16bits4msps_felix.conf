[GNSS-SDR]
; run `./run_gnss_sdr.sh --conf l1ca16bits4msps_l2c16bits4msps_felix.conf [recordings/<name>.sigmf]` to start GNSS-SDR
; with this configuration file
; felix.conf's processing settings (acquisition, tracking, PVT) applied to our recordings: x310usrp_record.py tuned to
; GPS L1 and L2 (--freq 1575.42e6 1227.6e6), both channels at 4 MS/s, int16 interleaved I/Q (ci16_le), read from
; files. Only what had to change for that differs from felix.conf:
;   - two live HackRFs (Osmosdr_Signal_Source, gr_complex) -> one Multichannel_File_Signal_Source (ishort) reading
;     both files in lockstep, plus an Ishort_To_Complex data type adapter per band
;   - live-only options dropped: telecommand, SUPL assistance, monitor UDP streams, RTCM outputs
;   - Acquisition_*.blocking=true (no live stream to overflow; reproducible runs on files)
;   - Acquisition_*.repeat_satellite=false (see below)

GNSS-SDR.internal_fs_sps=4000000
; ONE source reading both files: Multichannel_File_Signal_Source passes them through a single block, so both bands
; advance in lockstep. With two File_Signal_Sources each band runs as fast as the CPU allows, one band gets ahead
; of the other, and Observables discards every measurement of the band that lags. (felix.conf's two live HackRFs are
; paced by the hardware, so it doesn't need this)
GNSS-SDR.num_sources=1
GNSS-SDR.assist_dual_frequency_acq=true

; -------- Signal source: file 0 = GPS L1 (1575.42 MHz, TwinRX RX0), file 1 = GPS L2 (1227.60 MHz, TwinRX RX1) --------
SignalSource.implementation=Multichannel_File_Signal_Source
; number of files to read
SignalSource.total_channels=2
; number of output streams, one signal conditioner each (stream 0 -> SignalConditioner0, 1 -> SignalConditioner1)
SignalSource.RF_channels=2
SignalSource.filename0=/home/tapyu/git/usrp-x310/extracted_sigmf/x310_name/x310_name_ch0.sigmf-data
SignalSource.filename1=/home/tapyu/git/usrp-x310/extracted_sigmf/x310_name/x310_name_ch1.sigmf-data
; one item_type and one sampling_frequency for both files: both channels must be recorded in the same format and rate
SignalSource.item_type=ishort
SignalSource.sampling_frequency=4000000
SignalSource.samples=0

; -------- Signal conditioners (felix.conf: Pass_Through adapters, its sources already deliver gr_complex) --------
SignalConditioner0.implementation=Signal_Conditioner
DataTypeAdapter0.implementation=Ishort_To_Complex
InputFilter0.implementation=Pass_Through
Resampler0.implementation=Pass_Through

SignalConditioner1.implementation=Signal_Conditioner
DataTypeAdapter1.implementation=Ishort_To_Complex
InputFilter1.implementation=Pass_Through
Resampler1.implementation=Pass_Through

; -------- Channels (as felix.conf) --------
; GNSS-SDR numbers channels 1C first, then 2S: Channel0-7 are L1 C/A, Channel8-15 are L2C (M)
Channels_1C.count=8
Channels_2S.count=8
Channels.in_acquisition=1

Channel0.signal=1C
Channel1.signal=1C
Channel2.signal=1C
Channel3.signal=1C
Channel4.signal=1C
Channel5.signal=1C
Channel6.signal=1C
Channel7.signal=1C
Channel8.signal=2S
Channel9.signal=2S
Channel10.signal=2S
Channel11.signal=2S
Channel12.signal=2S
Channel13.signal=2S
Channel14.signal=2S
Channel15.signal=2S

Channel0.RF_channel_ID=0
Channel1.RF_channel_ID=0
Channel2.RF_channel_ID=0
Channel3.RF_channel_ID=0
Channel4.RF_channel_ID=0
Channel5.RF_channel_ID=0
Channel6.RF_channel_ID=0
Channel7.RF_channel_ID=0
Channel8.RF_channel_ID=1
Channel9.RF_channel_ID=1
Channel10.RF_channel_ID=1
Channel11.RF_channel_ID=1
Channel12.RF_channel_ID=1
Channel13.RF_channel_ID=1
Channel14.RF_channel_ID=1
Channel15.RF_channel_ID=1

; -------- GPS L1 C/A acquisition (as felix.conf) --------
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.pfa=0.001
Acquisition_1C.doppler_max=5000
Acquisition_1C.doppler_step=100
Acquisition_1C.max_dwells=1
; false (felix.conf: true): with true, a failed search retries the same satellite forever, and with only one channel
; in acquisition (Channels.in_acquisition=1) the whole receiver stayed stuck on a satellite that isn't visible --
; on l1ca16bits4msps_l2c16bits4msps only PRN 1 was ever tracked, on L1 only, with no position
Acquisition_1C.repeat_satellite=false
; true, not felix.conf's "flase" (a typo gnss-sdr doesn't recognize, so it falls back to the default, true anyway)
Acquisition_1C.blocking=true

; -------- GPS L2C (M) acquisition (as felix.conf) --------
Acquisition_2S.implementation=GPS_L2_M_PCPS_Acquisition
Acquisition_2S.item_type=gr_complex
Acquisition_2S.coherent_integration_time_ms=20
Acquisition_2S.pfa=0.00001
Acquisition_2S.doppler_max=5000
Acquisition_2S.doppler_step=100
Acquisition_2S.max_dwells=1
; false (felix.conf: true): see Acquisition_1C.repeat_satellite
Acquisition_2S.repeat_satellite=false
; true (felix.conf: false, for its live radios): no live stream to overflow, and runs on files are reproducible
Acquisition_2S.blocking=true

; -------- GPS L1 C/A tracking (as felix.conf) --------
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.pll_bw_hz=50
Tracking_1C.pll_bw_narrow_hz=5
Tracking_1C.dll_bw_hz=5
Tracking_1C.dll_bw_narrow_hz=1
Tracking_1C.order=3
Tracking_1C.early_late_space_narrow_chips=0.05
Tracking_1C.early_late_space_chips=0.5

; -------- GPS L2C (M) tracking (as felix.conf) --------
Tracking_2S.implementation=GPS_L2_M_DLL_PLL_Tracking
Tracking_2S.item_type=gr_complex
Tracking_2S.pll_bw_hz=50
Tracking_2S.dll_bw_hz=5
Tracking_2S.early_late_spacing_chips=0.5
Tracking_2S.dll_filter_order=3
Tracking_2S.pll_filter_order=3

; -------- Navigation message --------
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_2S.implementation=GPS_L2C_Telemetry_Decoder

; -------- Observables --------
Observables.implementation=Hybrid_Observables

; -------- PVT (as felix.conf, without its live outputs) --------
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=PPP_Static
PVT.iono_model=Broadcast
PVT.trop_model=Saastamoinen
PVT.output_rate_ms=100
PVT.display_rate_ms=1000
PVT.rinex_version=2
